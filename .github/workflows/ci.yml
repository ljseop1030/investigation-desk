name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 콘텐츠가 없는 환경. vite build는 돌리지 않는다.
      # core는 브라우저도 콘텐츠도 없이 돌아야 한다.
      - run: npm run check