name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 먼저 끝나 옛 빌드가 올라갈 수 있다.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # submodules의 인증에도 이 token을 쓴다. 안 넘기면 기본 GITHUB_TOKEN으로
      # 가서 프라이빗 콘텐츠 저장소에서 막힌다. 부모도 같은 토큰으로 받으므로
      # 두 저장소 모두 Contents:read 가 필요하다.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.CONTENT_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 배포되는 커밋이 테스트를 통과한 커밋이어야 한다.
      - run: npm test

      # 서브모듈이 조용히 빠진 경우를 여기서 잡는다. 빠져도 vite build는
      # 성공하고 화면만 비기 때문에, 빌드 앞에 둬야 의미가 있다.
      - run: npm run check:content

      - run: npm run build
        env:
          VITE_TEMPO: ${{ vars.VITE_TEMPO }}

      # 빌드 산출물을 artifact로 올리지 않는다. 퍼블릭 저장소의 artifact는
      # 누구나 받을 수 있다. 같은 job 안에서 배포하고 끝낸다.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=investigation-desk --branch=main